name: Aplikacja na Androida

on:
  push:
    branches: [master]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Klucz podpisu
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lisiapraca.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/lisiapraca.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Brak sekretu KEYSTORE_B64 – APK będzie podpisany kluczem testowym i nie trafi do Releases."
          fi

      - name: Budowanie APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - run: cp android/app/build/outputs/apk/release/app-release.apk LisiaPraca.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LisiaPraca-apk
          path: LisiaPraca.apk

      - name: Wydanie (Releases)
        if: env.KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" LisiaPraca.apk \
            --title "Lisia Praca 1.0.${{ github.run_number }}" \
            --notes "Plik LisiaPraca.apk do instalacji na telefonie." \
            --latest
